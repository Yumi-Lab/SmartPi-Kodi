name: Release

# Manual release: merges develop into main, builds every variant and
# uploads the split 7z images to the versioned GitHub Release.
#
# Runs entirely on the built-in GITHUB_TOKEN (no PAT secret): the version
# bump and changelog commits do not need to retrigger other workflows.
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: New version number in X.Y.Z
        required: true

permissions:
  contents: write

jobs:
  push-version-number:
    name: Push version number
    runs-on: ubuntu-latest
    steps:
      - name: Clone develop repository
        uses: actions/checkout@v4
        with:
          ref: "develop"

      - name: Get current version
        id: current-version
        shell: bash
        run: |
          version=$(cat ./src/version)
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Push version number
        if: steps.current-version.outputs.version != github.event.inputs.version
        shell: bash
        run: |
          echo ${{ github.event.inputs.version }} > ./src/version

      - name: git add & commit & push
        if: steps.current-version.outputs.version != github.event.inputs.version
        uses: EndBug/add-and-commit@v9
        with:
          add: "./src/version"
          default_author: github_actions
          message: "chore: push version number to v${{ github.event.inputs.version }}"
          push: true

  update-master-branch:
    name: Update master branch
    needs: push-version-number
    runs-on: ubuntu-latest
    steps:
      - uses: everlytic/branch-merge@1.1.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_ref: "develop"
          target_branch: "main"
          commit_message_template: "[Automated] Merged {source_ref} into target {target_branch}"

  release:
    name: Create Release
    needs: update-master-branch
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create-release.outputs.id }}
      date: ${{ steps.base-name.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        shell: bash
        run: |
          echo "TAG_NAME=$(git describe --tags $(git rev-list --tags --max-count=1))" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        shell: bash
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin git-cliff-2.7.0/git-cliff

      - name: Generate a changelog
        id: changelog
        shell: bash
        run: |
          CONTENT=$(git-cliff --config ./cliff-release.toml ${{ steps.latest_tag.outputs.TAG_NAME }}..HEAD 2>/dev/null || echo "")
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "${CONTENT}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create empty release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "SmartPi-Kodi ${{ github.event.inputs.version }}"
          tag_name: ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          draft: true

      - name: Create Date
        id: base-name
        if: always()
        shell: bash
        run: |
          NOW="$(date +"%Y-%m-%d")"
          echo "date=${NOW}" >> $GITHUB_OUTPUT

  matrix:
    name: Create Matrix
    needs: release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create Matrix
        id: set-matrix
        run: |
          PY_INT=$(command -v python3)
          CONFIG="${{ github.workspace }}/.github/workflow_config.yml"
          GROUP="release"
          $PY_INT ${{ github.workspace }}/.github/scripts/setup_matrix.py -c $CONFIG -g $GROUP --git

  build:
    needs: [release, matrix]
    runs-on: ubuntu-latest
    outputs:
      base_name: ${{ steps.move-image.outputs.base_name }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: repository
          submodules: true

      - name: Build image
        id: build
        uses: ./repository/.github/actions/build
        with:
          config: ${{ matrix.config }}

      - name: Upload failed Logfile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ steps.move-image.outputs.image }}.log
          path: repository/src/build.log

      - name: Rename image file
        id: move-image
        shell: bash
        run: |
          source repository/src/config
          base_name="${{ needs.release.outputs.date }}-${DIST_NAME}-${DIST_VERSION}"
          image="${base_name}-${{ steps.build.outputs.type }}-${{ steps.build.outputs.sbc }}"
          mv repository/src/workspace/*.img $image.img

          echo "base_name=${base_name}" >> $GITHUB_OUTPUT
          echo "image=${image}" >> $GITHUB_OUTPUT

      - name: Compressing Image
        shell: bash
        run: |
          CPU_COUNT="$(nproc)"
          IMAGE="${{ steps.move-image.outputs.image }}"
          sudo apt-get install -y p7zip-full
          echo -e "\e[32mUsing ${CPU_COUNT} Cores for compression (7z split)...\e[0m"
          # 7z split archive — .001/.002 are natively opened by The Unarchiver (Mac) and 7-Zip (Windows)
          7z a -v1900m -mx=9 "-mmt=${CPU_COUNT}" "${IMAGE}.img.7z" "${IMAGE}.img"

      - name: Upload Compressing Image
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${{ steps.move-image.outputs.image }}"
          for part in "${IMAGE}.img.7z."*; do
            gh release upload "${{ github.event.inputs.version }}" \
              "${part}" \
              --repo "${{ github.repository }}" \
              --clobber
          done

      - name: Calculating checksums
        id: checksums
        shell: bash
        run: |
          IMAGE="${{ steps.move-image.outputs.image }}"
          sha256sum "${IMAGE}.img" > "${IMAGE}.img.sha256"
          image_checksum=$(awk '{ print $1 }' "${IMAGE}.img.sha256")
          echo "image=${image_checksum}" >> $GITHUB_OUTPUT

          sha256sum "${IMAGE}.img.7z.001" > "${IMAGE}.img.7z.sha256"
          zip_checksum=$(awk '{ print $1 }' "${IMAGE}.img.7z.sha256")
          echo "zip=${zip_checksum}" >> $GITHUB_OUTPUT

      - name: Upload Checksums
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${{ steps.move-image.outputs.image }}"
          gh release upload "${{ github.event.inputs.version }}" \
            "${IMAGE}.img.sha256" \
            "${IMAGE}.img.7z.sha256" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Calculating filesizes
        id: filesizes
        shell: bash
        run: |
          IMAGE="${{ steps.move-image.outputs.image }}"
          image_filesize=$(wc -c "${IMAGE}.img" | awk '{print $1}')
          echo "image=${image_filesize}" >> $GITHUB_OUTPUT

          zip_filesize=$(wc -c "${IMAGE}.img.7z.001" | awk '{print $1}')
          echo "zip=${zip_filesize}" >> $GITHUB_OUTPUT

      - name: Debug output
        run: |
          echo "release-id: ${{ needs.release.outputs.id }}"
          echo "release-version: ${{ needs.release.outputs.version }}"

          echo "image-name: ${{ steps.move-image.outputs.image }}"

          echo "checksum image: ${{ steps.checksums.outputs.image }}"
          echo "checksum zip: ${{ steps.checksums.outputs.zip }}"

          echo "filesize-image: ${{ steps.filesizes.outputs.image }}"
          echo "filesize-zip: ${{ steps.filesizes.outputs.zip }}"

  finish:
    name: Finish Release
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.release.outputs.id }}

  update-changelog:
    needs: finish
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: "develop"
          fetch-depth: 0

      - name: Install git-cliff
        shell: bash
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin git-cliff-2.7.0/git-cliff

      # Full-history changelog: regenerating the whole file each release is
      # idempotent and never depends on a start tag existing (the template's
      # 0.0.0..X.Y.Z range broke the very first release).
      - name: Generate a changelog
        id: git-cliff
        shell: bash
        run: |
          git-cliff --config cliff.toml --output "${{ github.workspace }}/CHANGELOG.md"

      - name: Show CHANGELOG
        run: |
          cat CHANGELOG.md
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "docs(changelog): update changelog"
          file_pattern: CHANGELOG.md
